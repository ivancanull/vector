[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hfss-worker"
version = "0.1.0"
description = "Windows-side HFSS queue worker"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "scikit-rf>=1.2",
  "paramiko>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
