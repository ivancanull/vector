target:
  name: transmission_line
  port_num: 4
  port_combinations:
    - [0, 0]
    - [0, 1]
    - [0, 2]
    - [0, 3] 
    
data:
  path: data/Coupled_Transmission_Line_export
  start_idx: 4
  freqs:
    min: 5.0e+9
    max: 10.0125e+9
    step: 0.0125e+9
  regularization: 
    min: [1.5, 25, 30, 2.5, 5.0e+9]
    max: [2.0, 30, 35, 3.0, 10.0e+9]
  y_regularization: 
    r: [1, 1, 0.1, 0.1]
    i: [1, 1, 0.1, 0.1]
  mode: ri

guide_model:
  name: bnn
  input_dim: 5
  hidden_dims: [256, 256, 256]
  output_channels:
    r: [4, 1]
    i: [4, 1]

iter_num: 6

train:
  epochs: 4000

test:
  samples: 100

online:
  data_sample_size: 50
  dataset_update_method: uncertainty_aware
  freq_sample_method: uncertainty_aware
  freq_sample_size: 20
  forget: True

vector_fitting:
  n_poles_real: 4
  n_poles_complex: 8
  
save_name: line_bnn_online_uaw_uaw

  